<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Static Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            text-align: center;
            padding: 70px 20px;
        }
        .card {
            background: white;
            max-width: 650px;
            margin: auto;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #cbd5e1;
        }
        h1 { color: #2563eb; }
        p { color: #334155; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="card">
        <h1>My First DevOps CI/CD Project</h1>
        <p>Website hosted using Docker and Nginx.</p>
        <p>Source: GitHub | CI/CD: Jenkins</p>
        <p>Security: Trivy | Registry: Docker Hub</p>
        <p>Status: Successfully containerized!</p>
    </div>
</body>
</html>
